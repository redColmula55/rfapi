plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group
int java_version = Integer.parseInt(project.java_version)

allprojects {
    apply {
        plugin 'fabric-loom'
    }

    base {
        archivesName = project.archives_base_name
    }

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.

        // Modrinth Maven
        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }
        // Cloth Config API / REI
        maven { url "https://maven.shedaniel.me/" }
        // Mod Menu
        maven { url "https://maven.terraformersmc.com/releases/" }
    }

    dependencies {
        // To change the versions see the gradle.properties file
        minecraft "com.mojang:minecraft:${project.minecraft_version}"
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
        modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

        // Fabric API. This is technically optional, but you probably want it anyway.
        modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

        // Sodium
        modImplementation "maven.modrinth:sodium:${project.sodium_version}-fabric"
        // Cloth Config Api
        modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
        // Mod Menu
        modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
        // REI
        modApi("me.shedaniel:RoughlyEnoughItems-fabric:${project.rei_version}") {
            exclude(group: "net.fabricmc.fabric-api")
        }
    }

    processResources {
        inputs.property "mod_version", project.version
        inputs.property "minecraft_version", project.properties.minecraft_version
        inputs.property "java_version", project.java_version

        filesMatching("fabric.mod.json") {
            expand([
                    "mod_version": inputs.properties.mod_version,
                    "minecraft_version": inputs.properties.minecraft_version,
                    "java_version": inputs.properties.java_version
            ])
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.release = java_version
    }

    java {
        // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
        // if it is present.
        // If you remove this line, sources will not be generated.
        withSourcesJar()

        sourceCompatibility = JavaVersion.toVersion(java_version)
        targetCompatibility = JavaVersion.toVersion(java_version)
    }

    jar {
        inputs.property "archivesName", project.base.archivesName

        for (File file : fileTree(project.getRootDir())) {
            if (file.name.matches("LICENSE([_\\-\\w]+)?(.(txt|TXT|md|MD))?")) {
                from(file) {
                    rename { "${it}_${inputs.properties.archivesName}" }
                }
            }
        }
    }

    fabricApi {
        configureDataGeneration {
            client = true
        }
    }
}

dependencies {
    // Test API
    testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

test {
    useJUnitPlatform()
}

loom {
    accessWidenerPath = file("src/main/resources/reservoir-api.accesswidener")
}
